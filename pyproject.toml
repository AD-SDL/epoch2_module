[project]
name = "epoch2_module"
version = "2.0.0"
description = "Python MADSci Node module to control the Epoch 2 Platereader"
authors = [
    {name = "Ryan D. Lewis", email="ryan.lewis@anl.gov"},
    {name = "Tobias Ginsburg", email="tginsbu@anl.gov"},
]
dependencies = [
    "madsci.node_module~=0.5.0",
    "madsci.client~=0.5.0",
    "madsci.common~=0.5.0",
    "pythonnet",
]
requires-python = ">=3.9.1,<3.14"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/AD-SDL/epoch2_module"


[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
]
